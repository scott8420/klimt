<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Klimt: a square spiral over a mosaic of tiles: pattern against flat
       field. currentColor throughout so GTK's symbolic pipeline recolours it
       to the theme foreground. -->
