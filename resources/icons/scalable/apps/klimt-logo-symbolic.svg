    <rect x="1" y="1" width="4" height="4" rx="0.6"/>
    <rect x="1" y="6" width="4" height="4" rx="0.6" opacity="0.55"/>
    <rect x="1" y="11" width="4" height="4" rx="0.6"/>
    <path d="M7 1h8v14H7v-2h6V3H9v8h2V5h2v8H7z" fill-rule="evenodd"/>
  </g>
</svg>
